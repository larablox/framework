version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # `rbxtsc` does not compile with this TypeScript: `roblox-ts` pins its
      # own as a hard dependency (`=5.5.3`) and requires it from its nested
      # copy. Ours is only what the editor and the typed ESLint rules read,
      # and `typescript-eslint` caps that at `<6.1.0` -- because TypeScript 7
      # is the Go port, whose package exports a version string and no
      # compiler API at all. A major here can only break the install.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
