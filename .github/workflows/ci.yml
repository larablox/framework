name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run lint

    analyze:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - uses: CompeyDev/setup-rokit@v0.1.2

            - run: npm run types:roblox

            - run: npm run analyze

    tests:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - uses: CompeyDev/setup-rokit@v0.1.2

            - run: npm test
