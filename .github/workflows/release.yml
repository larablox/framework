name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Verify the tag matches package.json
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "Run this against a v* tag, not $GITHUB_REF_NAME: a branch does not say which version to publish" >&2
              exit 1
          fi

          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
              exit 1
          fi

      - run: npm run build

      - run: npm publish
