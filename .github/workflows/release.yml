name: Release

on:
    # A tag pushed from a terminal and a tag made through GitHub's interface
    # both arrive as a push. Adding `release: types: [published]` alongside this
    # -- which the workflow briefly did -- fires an interface release twice, and
    # the second run stops at `npm publish` with "version already exists".
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: read
    # Required for npm trusted publishing (OIDC); npm attaches a provenance
    # attestation on its own once it is here.
    id-token: write

jobs:
    checks:
        uses: ./.github/workflows/ci.yml

    publish:
        needs: checks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  # `.nvmrc` is on 24 for this: trusted publishing needs npm
                  # >= 11.5.1, and the 22 line is pinned to npm 10 for life.
                  node-version-file: .nvmrc
                  cache: npm
                  registry-url: https://registry.npmjs.org

            # The ref is checked first because `workflow_dispatch` will happily
            # run against a branch, which does not say which version to publish.
            - name: Verify the tag matches package.json
              run: |
                  if [ "$GITHUB_REF_TYPE" != "tag" ]; then
                      echo "Run this against a v* tag, not $GITHUB_REF_NAME: a branch does not say which version to publish" >&2
                      exit 1
                  fi

                  tag="${GITHUB_REF_NAME#v}"
                  version="$(node -p "require('./package.json').version")"
                  if [ "$tag" != "$version" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
                      exit 1
                  fi

            - run: npm ci

            - run: npm run build

            - run: npm publish
